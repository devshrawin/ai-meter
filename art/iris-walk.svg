          <path class="eye-shut" d="M32.2 21.599999999999998 q2.8 2.2 5.6 0 M42.2 21.599999999999998 q2.8 2.2 5.6 0" fill="none" stroke="#5b504c" stroke-width="1" stroke-linecap="round"/>
