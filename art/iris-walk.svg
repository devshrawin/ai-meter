          <ellipse cx="38" cy="15" rx="7" ry="3.6" fill="url(#iris-sheen)" opacity=".9"/>
          <path class="wisp" d="M29 27 l-2.2 1.2 M29.6 29.6 l-2 1.6 M51 27 l2.2 1.2 M50.4 29.6 l2 1.6 M40 10.2 v2.4 M37.8 10.6 l.5 2 M42.2 10.6 l-.5 2"/>
