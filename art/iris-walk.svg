          <ellipse class="blush" cx="55.4" cy="29.4" rx="2.3" ry="1.25" fill="#f9b3c8"/>
          <ellipse class="blush" cx="69.6" cy="29.4" rx="2.3" ry="1.25" fill="#f9b3c8"/>
    <ellipse cx="60.4" cy="30.599999999999998" rx="2.6" ry="1.9" fill="#ffffff"/>
