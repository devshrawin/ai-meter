    <ellipse cx="42.1" cy="28.2" rx="2.6" ry="1.9" fill="#ffffff"/>
    <path d="M38.5 25.8 h3 q-.3 1.5 -1.5 2 q-1.2 -.5 -1.5 -2 z" fill="url(#iris-nose)"/>
    <path d="M40 27.8 v.8 M40 28.6 q-1.2 1.3 -2.4 .4 M40 28.6 q1.2 1.3 2.4 .4"
      fill="none" stroke="#c09aa0" stroke-width=".55" stroke-linecap="round"/>
