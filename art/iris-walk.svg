    <circle cx="58.65" cy="22.3" r="1" fill="#fff"/>
    <circle cx="56.7" cy="25.1" r=".45" fill="#fff" opacity=".8"/>
    <ellipse cx="67.4" cy="23.6" rx="3.1" ry="3.4" fill="url(#iris-eye)" stroke="#3d4f68" stroke-width=".45"/>
    <ellipse cx="67.65" cy="23.85" rx="1.1" ry="2.4" fill="#1a1f2b"/>
    <circle cx="68.45" cy="22.3" r="1" fill="#fff"/>
    <circle cx="66.5" cy="25.1" r=".45" fill="#fff" opacity=".8"/></g>
          <path class="eye-shut" d="M54.800000000000004 24 q2.8 2.2 5.6 0 M64.60000000000001 24 q2.8 2.2 5.6 0" fill="none" stroke="#5b504c" stroke-width="1" stroke-linecap="round"/>
